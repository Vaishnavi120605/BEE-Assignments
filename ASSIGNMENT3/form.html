<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Feedback Form</title>
<link rel="stylesheet" href="form.css">
</head>
<body>

  <div class="container">
    <h1>Student Feedback Form</h1>

    <form id="feedbackForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
        <span class="error" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email address">
        <span class="error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select id="course">
          <option value="">Select Course</option>
          <option value="Web Development">Web Development</option>
          <option value="Data Science">Data Science</option>
          <option value="UI/UX Design">UI/UX Design</option>
          <option value="Cybersecurity">Cybersecurity</option>
          <option value="AI & Machine Learning">AI & Machine Learning</option>
        </select>
        <span class="error" id="courseError"></span>
      </div>

      <div class="form-group">
        <label for="feedback">Feedback</label>
        <textarea id="feedback" rows="4" placeholder="Share your feedback..."></textarea>
        <span class="error" id="feedbackError"></span>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-primary">Submit Feedback</button>
        <button type="button" id="deleteBtn" class="btn btn-danger">Delete Stored Data</button>
      </div>
    </form>

    <p class="session-user" id="sessionUser"></p>

    <div class="stored-section">
      <h2>Stored Feedback</h2>
      <div id="storedFeedback" class="stored-box">No feedback stored.</div>
    </div>
  </div>

<script src="form.js"></script>
</body>
</html>
